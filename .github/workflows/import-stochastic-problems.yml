name: Import stochastic-problems publications

on:
  schedule:
    - cron: '41 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: import-stochastic-problems
  cancel-in-progress: true

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Install the public repository's pinned Lean toolchain
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -sSf \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain "$(cat lean-toolchain)"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/lean" --version

      - name: Fetch, validate, kernel-check, and stage authorized publications
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"

          mapfile -t problem_ids < <(python3 - <<'PY'
          import importlib.util
          spec = importlib.util.spec_from_file_location('validator', 'scripts/validate_stochastic_export.py')
          mod = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(mod)
          for problem_id in sorted(mod.PUBLICATIONS):
              print(problem_id)
          PY
          )

          imported=0
          for problem_id in "${problem_ids[@]}"; do
            remote_ref="refs/heads/incoming/stochastic-problems/${problem_id}"
            local_ref="refs/remotes/origin/incoming-stochastic-${problem_id}"

            if ! git ls-remote --exit-code origin "$remote_ref" >/dev/null 2>&1; then
              echo "No incoming publication branch for ${problem_id}; leaving current public copy unchanged."
              continue
            fi

            git fetch --force origin "${remote_ref}:${local_ref}"
            incoming="/tmp/incoming-${problem_id}"
            validated="/tmp/validated-${problem_id}"
            receipt="/tmp/receipt-${problem_id}.json"
            leancheck="/tmp/leancheck-${problem_id}"
            rm -rf "$incoming" "$validated" "$receipt" "$leancheck"
            mkdir -p "$incoming"
            git archive "$local_ref" | tar -x -C "$incoming"

            python3 scripts/validate_stochastic_export.py \
              "$incoming" "$validated" --receipt "$receipt"

            mkdir -p "$leancheck/Generated"
            cp "$validated/Proof.lean" "$leancheck/Generated/Proof.lean"
            cp lean-toolchain "$leancheck/lean-toolchain"
            cat > "$leancheck/lakefile.lean" <<'EOF'
          import Lake
          open Lake DSL
          package incoming_stochastic_proof
          @[default_target]
          lean_lib Generated
          EOF
            printf '%s\n' 'import Generated.Proof' > "$leancheck/Generated.lean"

            (
              cd "$leancheck"
              lake build
              lake env leanchecker --fresh Generated.Proof
              lake env lean Generated/Proof.lean 2>&1 | tee /tmp/incoming-axioms.txt
            )

            RECEIPT="$receipt" python3 - <<'PY'
          import json, os, re
          from pathlib import Path
          receipt = json.loads(Path(os.environ['RECEIPT']).read_text())
          text = Path('/tmp/incoming-axioms.txt').read_text()
          allowed = {'propext', 'Classical.choice', 'Quot.sound'}
          lines = [x for x in text.splitlines() if 'depends on axioms:' in x]
          if not lines:
              raise SystemExit('incoming proof emitted no #print axioms lines')
          seen = set()
          for line in lines:
              mname = re.match(r"'([^']+)' depends on axioms:", line)
              maxiom = re.search(r'depends on axioms:\s*\[(.*)\]\s*$', line)
              if not mname or not maxiom:
                  raise SystemExit(f'cannot parse axiom output: {line!r}')
              seen.add(mname.group(1))
              used = {x.strip() for x in maxiom.group(1).split(',') if x.strip()}
              bad = used - allowed
              if bad:
                  raise SystemExit(f'non-standard axioms in incoming proof: {sorted(bad)}')
          missing = set(receipt['audit_declarations']) - seen
          if missing:
              raise SystemExit(f'missing required axiom-audited declarations: {sorted(missing)}')
          if 'sorryAx' in text or 'Lean.trustCompiler' in text:
              raise SystemExit('forbidden trust escape in incoming proof')
          print(f"incoming axiom audit passed; required declarations={len(receipt['audit_declarations'])}")
          PY

            public_root="$(RECEIPT="$receipt" python3 - <<'PY'
          import json, os
          from pathlib import Path
          d = json.loads(Path(os.environ['RECEIPT']).read_text())
          root = d['public_root']
          if not root.startswith('Formal/Published/') or '..' in root.split('/'):
              raise SystemExit('unsafe public_root')
          print(root)
          PY
            )"

            rm -rf "$public_root"
            mkdir -p "$public_root"
            cp -a "$validated"/. "$public_root"/
            cp "$receipt" "$public_root/SYNC-RECEIPT.json"
            imported=$((imported + 1))
          done

          echo "Validated and staged ${imported} incoming publication(s)."

      - name: Commit only validated public artifacts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Formal/Published
          if git diff --cached --quiet; then
            echo 'Published stochastic-problems artifacts are already current.'
          else
            git commit -m 'chore(formal): import validated stochastic-problems publications'
            git push origin HEAD:master
          fi
