name: Import stochastic-problems publications

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/import-stochastic-problems.yml'
      - 'scripts/validate_stochastic_export.py'
  schedule:
    - cron: '41 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: import-stochastic-problems
  cancel-in-progress: true

jobs:
  validate:
    name: validate incoming bundles without write authority
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
          persist-credentials: false

      - name: Install the public repository's pinned Lean toolchain
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -sSf \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain "$(cat lean-toolchain)"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/lean" --version

      - name: Fetch, materialize, validate, and kernel-check authorized publications
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          stage=/tmp/publication-stage
          rm -rf "$stage"
          mkdir -p "$stage"

          mapfile -t problem_ids < <(python3 - <<'PY'
          import importlib.util
          spec = importlib.util.spec_from_file_location('validator', 'scripts/validate_stochastic_export.py')
          mod = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(mod)
          for problem_id in sorted(mod.PUBLICATIONS):
              print(problem_id)
          PY
          )

          imported=0
          for problem_id in "${problem_ids[@]}"; do
            remote_ref="refs/heads/incoming/stochastic-problems/${problem_id}"
            local_ref="refs/remotes/origin/incoming-stochastic-${problem_id}"

            if ! git ls-remote --exit-code https://github.com/${GITHUB_REPOSITORY}.git "$remote_ref" >/dev/null 2>&1; then
              echo "No incoming publication branch for ${problem_id}; leaving current public copy unchanged."
              continue
            fi

            git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)" \
              fetch --force https://github.com/${GITHUB_REPOSITORY}.git \
              "${remote_ref}:${local_ref}"

            incoming="/tmp/incoming-${problem_id}"
            validated="/tmp/validated-${problem_id}"
            receipt="/tmp/receipt-${problem_id}.json"
            leancheck="/tmp/leancheck-${problem_id}"
            rm -rf "$incoming" "$validated" "$receipt" "$leancheck"
            mkdir -p "$incoming/payload/${problem_id}"

            # Read the manifest first, then materialize only file names authorized
            # by the trusted validator on master.  No untrusted tar archive is extracted.
            git show "${local_ref}:EXPORT-MANIFEST.json" > "$incoming/EXPORT-MANIFEST.json"
            POLICY_OUT="/tmp/policy-${problem_id}.txt" PROBLEM_ID="$problem_id" \
              python3 - <<'PY'
          import importlib.util, json, os
          from pathlib import Path, PurePosixPath
          spec = importlib.util.spec_from_file_location('validator', 'scripts/validate_stochastic_export.py')
          mod = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(mod)
          pid = os.environ['PROBLEM_ID']
          policy = mod.PUBLICATIONS[pid]
          manifest = json.loads(Path(f'/tmp/incoming-{pid}/EXPORT-MANIFEST.json').read_text())
          if manifest.get('problem_id') != pid:
              raise SystemExit('incoming manifest problem_id mismatch')
          expected = {f'payload/{pid}/{name}' for name in policy['required_files']}
          entries = manifest.get('files')
          if not isinstance(entries, list):
              raise SystemExit('incoming manifest files is not a list')
          got = set()
          for item in entries:
              if not isinstance(item, dict) or not isinstance(item.get('path'), str):
                  raise SystemExit('malformed incoming file entry')
              p = item['path']
              if p not in expected:
                  raise SystemExit(f'unapproved incoming path: {p!r}')
              got.add(p)
          if got != expected or len(entries) != len(expected):
              raise SystemExit('incoming file set differs from public policy')
          Path(os.environ['POLICY_OUT']).write_text('\n'.join(sorted(expected)) + '\n')
          PY

            while IFS= read -r path; do
              mkdir -p "$incoming/$(dirname "$path")"
              git show "${local_ref}:${path}" > "$incoming/${path}"
            done < "/tmp/policy-${problem_id}.txt"

            python3 scripts/validate_stochastic_export.py \
              "$incoming" "$validated" --receipt "$receipt"

            mkdir -p "$leancheck/Generated"
            cp "$validated/Proof.lean" "$leancheck/Generated/Proof.lean"
            cp lean-toolchain "$leancheck/lean-toolchain"
            cat > "$leancheck/lakefile.lean" <<'EOF'
          import Lake
          open Lake DSL
          package incoming_stochastic_proof
          @[default_target]
          lean_lib Generated
          EOF
            printf '%s\n' 'import Generated.Proof' > "$leancheck/Generated.lean"

            (
              cd "$leancheck"
              lake build
              lake env leanchecker --fresh Generated.Proof
              lake env lean Generated/Proof.lean 2>&1 | tee "/tmp/incoming-axioms-${problem_id}.txt"
            )

            RECEIPT="$receipt" AXIOMS="/tmp/incoming-axioms-${problem_id}.txt" python3 - <<'PY'
          import json, os, re
          from pathlib import Path
          receipt = json.loads(Path(os.environ['RECEIPT']).read_text())
          text = Path(os.environ['AXIOMS']).read_text()
          allowed = {'propext', 'Classical.choice', 'Quot.sound'}
          lines = [x for x in text.splitlines() if 'depends on axioms:' in x]
          if not lines:
              raise SystemExit('incoming proof emitted no #print axioms lines')
          seen = set()
          for line in lines:
              mname = re.match(r"'([^']+)' depends on axioms:", line)
              maxiom = re.search(r'depends on axioms:\s*\[(.*)\]\s*$', line)
              if not mname or not maxiom:
                  raise SystemExit(f'cannot parse axiom output: {line!r}')
              seen.add(mname.group(1))
              used = {x.strip() for x in maxiom.group(1).split(',') if x.strip()}
              bad = used - allowed
              if bad:
                  raise SystemExit(f'non-standard axioms in incoming proof: {sorted(bad)}')
          missing = set(receipt['audit_declarations']) - seen
          if missing:
              raise SystemExit(f'missing required axiom-audited declarations: {sorted(missing)}')
          if 'sorryAx' in text or 'Lean.trustCompiler' in text:
              raise SystemExit('forbidden trust escape in incoming proof')
          print(f"incoming axiom audit passed; required declarations={len(receipt['audit_declarations'])}")
          PY

            public_root="$(RECEIPT="$receipt" python3 - <<'PY'
          import json, os, re
          from pathlib import Path
          root = json.loads(Path(os.environ['RECEIPT']).read_text())['public_root']
          if not re.fullmatch(r'Formal/Published/[A-Za-z0-9._-]+', root):
              raise SystemExit('unsafe public_root')
          print(root)
          PY
            )"

            mkdir -p "$stage/$public_root"
            cp -a "$validated"/. "$stage/$public_root"/
            cp "$receipt" "$stage/$public_root/SYNC-RECEIPT.json"
            imported=$((imported + 1))
          done

          printf '%s\n' "$imported" > "$stage/publish-count.txt"
          echo "Validated and staged ${imported} incoming publication(s)."
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Upload validated publication stage
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: validated-stochastic-publications
          path: /tmp/publication-stage
          if-no-files-found: error
          retention-days: 1

  publish:
    name: publish already-validated artifacts
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 1

      - name: Download validated publication stage
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: validated-stochastic-publications
          path: /tmp/publication-stage

      - name: Copy validated files without executing them
        shell: bash
        run: |
          set -euo pipefail
          count="$(cat /tmp/publication-stage/publish-count.txt)"
          case "$count" in
            ''|*[!0-9]*) echo 'invalid publish count' >&2; exit 1 ;;
          esac
          if [ "$count" -eq 0 ]; then
            echo 'No incoming publication was available.'
            exit 0
          fi

          python3 - <<'PY'
          import re, shutil
          from pathlib import Path
          src_root = Path('/tmp/publication-stage/Formal/Published')
          dst_root = Path('Formal/Published')
          if not src_root.is_dir():
              raise SystemExit('validated stage has no Formal/Published directory')
          copied = 0
          for src in sorted(src_root.iterdir()):
              if not src.is_dir() or not re.fullmatch(r'[A-Za-z0-9._-]+', src.name):
                  raise SystemExit(f'unsafe staged directory: {src}')
              dst = dst_root / src.name
              if dst.exists():
                  shutil.rmtree(dst)
              shutil.copytree(src, dst)
              copied += 1
          if copied == 0:
              raise SystemExit('publish count was nonzero but no publication directory was staged')
          print(f'copied {copied} validated publication(s)')
          PY

      - name: Commit validated public artifacts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Formal/Published
          if git diff --cached --quiet; then
            echo 'Published stochastic-problems artifacts are already current.'
          else
            git commit -m 'chore(formal): import validated stochastic-problems publications'
            git push origin HEAD:master
          fi
