name: Audit stochastic-problems incoming hashes

on:
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hashes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
          persist-credentials: false

      - name: Print manifest and actual incoming SHA-256 values
        shell: bash
        run: |
          set -euo pipefail
          ref='origin/incoming/stochastic-problems/p0001-qwen38-m1-ultra-q4'
          git rev-parse --verify "$ref"
          echo '--- manifest ---'
          git show "$ref:EXPORT-MANIFEST.json"
          echo '--- actual SHA-256 ---'
          for name in \
            PUBLIC-PROVENANCE.json Proof.lean evidence.md metadata.json \
            paper.en.md paper.en.tex paper.zh.md paper.zh.tex; do
            printf '%-32s ' "$name"
            git show "$ref:payload/p0001-qwen38-m1-ultra-q4/$name" | sha256sum | awk '{print $1}'
          done

      - name: Diagnose Chinese Markdown byte normalization
        shell: bash
        run: |
          set -euo pipefail
          ref='origin/incoming/stochastic-problems/p0001-qwen38-m1-ultra-q4'
          git show "$ref:payload/p0001-qwen38-m1-ultra-q4/paper.zh.md" > /tmp/zh.md
          python3 - <<'PY'
          import hashlib, unicodedata
          from pathlib import Path
          p = Path('/tmp/zh.md')
          data = p.read_bytes()
          text = data.decode('utf-8')
          variants = {
              'raw': data,
              'strip-final-newlines': data.rstrip(b'\n'),
              'exactly-one-final-newline': data.rstrip(b'\n') + b'\n',
              'crlf-to-lf': data.replace(b'\r\n', b'\n'),
              'nfc': unicodedata.normalize('NFC', text).encode('utf-8'),
              'nfkc': unicodedata.normalize('NFKC', text).encode('utf-8'),
              'nfc-one-final-newline': (unicodedata.normalize('NFC', text).rstrip('\n') + '\n').encode('utf-8'),
              'nfkc-one-final-newline': (unicodedata.normalize('NFKC', text).rstrip('\n') + '\n').encode('utf-8'),
          }
          for name, b in variants.items():
              print(f'{name:28s} bytes={len(b):6d} sha256={hashlib.sha256(b).hexdigest()}')
          print('final-bytes-hex:', data[-32:].hex())
          print('unicode-normalized-NFC:', text == unicodedata.normalize('NFC', text))
          print('unicode-normalized-NFKC:', text == unicodedata.normalize('NFKC', text))
          PY
