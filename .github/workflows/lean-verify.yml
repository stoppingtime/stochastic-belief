name: Lean proof verification

on:
  push:
    branches: [master]
    paths:
      - 'Formal/**'
      - 'Formal.lean'
      - 'lakefile.lean'
      - 'lean-toolchain'
      - '.github/workflows/lean-verify.yml'
  pull_request:
    branches: [master]
    paths:
      - 'Formal/**'
      - 'Formal.lean'
      - 'lakefile.lean'
      - 'lean-toolchain'
      - '.github/workflows/lean-verify.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: build + kernel recheck + axiom audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned Lean toolchain
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -sSf \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain "$(cat lean-toolchain)"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/lean" --version

      - name: Verify pinned proof hash
        shell: bash
        run: |
          set -euo pipefail
          cd Formal
          sha256sum -c PROOF-SHA256

      - name: Lake build
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          lake build

      - name: Re-check stored proof with leanchecker
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          lake env leanchecker --fresh Formal.Qwen38M1UltraBound

      - name: Axiom and source audit
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          sha256sum Formal/Qwen38M1UltraBound.lean
          lake env lean Formal/Qwen38M1UltraBound.lean 2>&1 | tee /tmp/lean-audit.txt
          python3 - <<'PY'
          import re
          from pathlib import Path

          text = Path('/tmp/lean-audit.txt').read_text()
          allowed = {'propext', 'Classical.choice', 'Quot.sound'}
          lines = [line for line in text.splitlines() if 'depends on axioms:' in line]
          if not lines:
              raise SystemExit('axiom audit failed: no #print axioms output found')
          for line in lines:
              m = re.search(r'depends on axioms:\s*\[(.*)\]\s*$', line)
              if not m:
                  raise SystemExit(f'axiom audit failed: cannot parse {line!r}')
              used = {x.strip() for x in m.group(1).split(',') if x.strip()}
              bad = used - allowed
              if bad:
                  raise SystemExit(f'axiom audit failed: non-standard axioms {sorted(bad)}')
          if 'sorryAx' in text or 'Lean.trustCompiler' in text:
              raise SystemExit('axiom audit failed: forbidden trust escape detected')
          print(f'axiom audit passed for {len(lines)} declarations')
          PY
